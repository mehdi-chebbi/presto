{% extends "base.html" %}

{% block title %}Server Error — WorldCereal Explorer{% endblock %}

{% block body %}
  <div style="
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
    font-family: 'Inter', system-ui, sans-serif;
  ">
    <div style="font-size: 80px; font-weight: 800; color: #e2e8f0; line-height: 1;">500</div>
    <h1 style="font-size: 20px; font-weight: 600; color: #334155; margin: 16px 0 8px;">Server error</h1>
    <p style="font-size: 14px; color: #64748b; margin-bottom: 24px;">Something went wrong on our end. Please try again.</p>
    <a href="{{ url_for('index') }}" style="
      display: inline-block;
      padding: 10px 24px;
      background: #2d7d3a;
      color: white;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    ">Go Home</a>
  </div>
{% endblock %}
